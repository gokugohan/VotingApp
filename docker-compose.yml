# Local, production-like stack: SQL Server + the app.
#   cp .env.example .env   # then set the passwords
#   docker compose up --build
# App: http://localhost:8080  ·  Health: /health/live, /health/ready
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
      MSSQL_PID: Express
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    image: votingapp:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=VotingApp;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - dpkeys:/keys
      - uploads:/app/wwwroot/images/candidates
      - sheetscans:/app/wwwroot/uploads/sheets

volumes:
  sqldata:
  dpkeys:
  uploads:
  sheetscans:
